[package]
name = "flowlens"
version = "0.1.0"
edition = "2021"
description = "FlowLens — liquid glass network traffic monitor"

[lib]
name = "flowlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pcap = "2"
etherparse = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"
sysinfo = "0.39"
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Services"] }

[profile.release]
strip = true
lto = true
